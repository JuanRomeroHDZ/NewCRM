name: EmailSaver CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emailcrm_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emailcrm_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/emailcrm_disposable_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/emailcrm_disposable_test
      EMAILCRM_DISPOSABLE_DATABASE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Prepare report verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core
          docker build --file backend/Dockerfile --target runtime-base --tag lessso-typst-ci backend
          typst_container=$(docker create lessso-typst-ci)
          trap 'docker rm "$typst_container" >/dev/null' EXIT
          docker cp "$typst_container:/usr/local/bin/typst" "$RUNNER_TEMP/typst"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Pytest test suite
        env:
          SERVER_SECRET_KEY: ci-test-ephemeral-secret-key-minimum-32-chars
          INITIAL_OWNER_PASSWORD: CiTestOwnerPassword123!
          FALLBACK_USD_MXN_RATE: "20.5"
        run: |
          pytest

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

  migration-smoke:
    name: Alembic fresh, versioned and legacy upgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lessso_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lessso_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Migrate an empty database twice
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/lessso_ci
          SERVER_SECRET_KEY: ci-migration-secret-key-minimum-thirty-two-characters
          FALLBACK_USD_MXN_RATE: "20.5"
        run: |
          python -m app.migrate
          python -m app.migrate

      - name: Preserve records while adopting a legacy schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/lessso_legacy_ci
          SERVER_SECRET_KEY: ci-migration-secret-key-minimum-thirty-two-characters
          FALLBACK_USD_MXN_RATE: "20.5"
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          import os
          from sqlalchemy import text
          from app import models
          from app.models import reports
          from app.database import AsyncSessionLocal, Base, engine
          from app.models import EmailAccount

          async def prepare():
              admin = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/lessso_ci")
              await admin.execute("CREATE DATABASE lessso_legacy_ci")
              await admin.close()
              async with engine.begin() as connection:
                  await connection.run_sync(Base.metadata.create_all)
              async with AsyncSessionLocal() as session:
                  session.add(EmailAccount(
                      id="legacy-record",
                      address="preserve@example.test",
                      notes="Legacy plaintext note for the migration smoke test.",
                  ))
                  await session.commit()
              async with engine.begin() as connection:
                  await connection.execute(text("ALTER TABLE email_accounts DROP COLUMN deleted_at"))
                  await connection.execute(text("ALTER TABLE email_accounts DROP COLUMN password_updated_at"))
                  await connection.execute(text("ALTER TABLE report_canvases DROP COLUMN encrypted_svg_snapshot"))
              await engine.dispose()

          asyncio.run(prepare())
          PY
          python -m app.migrate
          python -m app.migrate
          python - <<'PY'
          import asyncio
          from alembic.script import ScriptDirectory
          from sqlalchemy import text
          from app.database import engine
          from app.migrate import _alembic_config

          async def verify():
              async with engine.connect() as connection:
                  note = await connection.execute(text("SELECT notes FROM email_accounts WHERE id='legacy-record'"))
                  marker = await connection.execute(
                      text("SELECT id FROM core_data_migrations WHERE id='legacy_plaintext_notes_v1'")
                  )
                  revision = await connection.execute(text("SELECT version_num FROM alembic_version"))
                  assert note.scalar_one().startswith("enc:v1:")
                  assert marker.scalar_one() == "legacy_plaintext_notes_v1"
                  assert revision.scalar_one() == ScriptDirectory.from_config(_alembic_config()).get_current_head()
              await engine.dispose()

          asyncio.run(verify())
          PY

      - name: Refuse destructive downgrade of the adopted schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/lessso_legacy_ci
          SERVER_SECRET_KEY: ci-migration-secret-key-minimum-thirty-two-characters
          FALLBACK_USD_MXN_RATE: "20.5"
        run: |
          python - <<'PY'
          from alembic import command
          from app.migrate import _alembic_config

          try:
              command.downgrade(_alembic_config(), "base")
          except RuntimeError as exc:
              assert "respaldo" in str(exc).lower() or "irreversible" in str(exc).lower()
          else:
              raise AssertionError("The adopted schema must refuse destructive downgrade.")
          PY
          python - <<'PY'
          import asyncio
          from alembic.script import ScriptDirectory
          from sqlalchemy import text
          from app.database import engine
          from app.migrate import _alembic_config

          async def verify():
              async with engine.connect() as connection:
                  email = await connection.execute(text("SELECT address FROM email_accounts WHERE id='legacy-record'"))
                  revision = await connection.execute(text("SELECT version_num FROM alembic_version"))
                  assert email.scalar_one() == "preserve@example.test"
                  assert revision.scalar_one() == ScriptDirectory.from_config(_alembic_config()).get_current_head()
              await engine.dispose()

          asyncio.run(verify())
          PY

      - name: Upgrade a database already at revision 0003
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/lessso_versioned_ci
          SERVER_SECRET_KEY: ci-migration-secret-key-minimum-thirty-two-characters
          FALLBACK_USD_MXN_RATE: "20.5"
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def create_database():
              admin = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/lessso_ci")
              try:
                  await admin.execute("CREATE DATABASE lessso_versioned_ci")
              finally:
                  await admin.close()

          asyncio.run(create_database())
          PY
          python -m alembic upgrade 20261118_0003
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from app.database import engine

          async def seed():
              async with engine.begin() as connection:
                  await connection.execute(text("""
                      INSERT INTO crm_proposals
                      (id, folio, version, title, service_type, amount, currency, status,
                      is_viewed_by_user, created_at, updated_at)
                      VALUES ('existing-proposal', 'TEST-0001', 1, 'Existing quote',
                      'proyecto_unico', 100, 'MXN', 'borrador', false, now(), now())
                  """))
              await engine.dispose()

          asyncio.run(seed())
          PY
          python -m app.migrate
          python -m app.migrate
          python - <<'PY'
          import asyncio
          from alembic.script import ScriptDirectory
          from sqlalchemy import inspect, text
          from app.database import engine
          from app.migrate import _alembic_config

          async def verify():
              async with engine.connect() as connection:
                  result = await connection.execute(text("""
                      SELECT title, status, issued_pdf, response_evidence
                      FROM crm_proposals WHERE id = 'existing-proposal'
                  """))
                  assert result.one() == ("Existing quote", "borrador", None, None)
                  revision = await connection.execute(text("SELECT version_num FROM alembic_version"))
                  assert revision.scalar_one() == ScriptDirectory.from_config(_alembic_config()).get_current_head()
                  indexes = await connection.run_sync(lambda conn: inspect(conn).get_indexes("prospects"))
                  assert any(index["column_names"] == ["followup_due_date"] for index in indexes)
              await engine.dispose()

          asyncio.run(verify())
          PY

  docker-build:
    name: Compose validation and container builds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emailcrm_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emailcrm_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify backup and certificate tooling
        run: python3 -m unittest discover -s scripts/tests

      - name: Create temporary Compose environment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets

          template = Path(".env.example").read_text(encoding="utf-8")
          values = {
              "POSTGRES_PASSWORD": secrets.token_hex(32),
              "SERVER_SECRET_KEY": secrets.token_hex(32),
              "FALLBACK_USD_MXN_RATE": "20.5",
          }
          lines = []
          for line in template.splitlines():
              name = line.split("=", 1)[0] if "=" in line and not line.lstrip().startswith("#") else None
              lines.append(f"{name}={values[name]}" if name in values else line)
          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          chmod 600 .env

      - name: Validate stable and development Compose definitions
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Build production services and PDF test image
        run: |
          docker compose build backend frontend
          docker build --file backend/Dockerfile --target test --tag lessso-backend-test backend
          docker run --rm --network host --env-file .env \
            -e TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/emailcrm_disposable_test \
            -e EMAILCRM_DISPOSABLE_DATABASE=1 lessso-backend-test

      - name: Verify a fresh stable installation over HTTPS
        env:
          COMPOSE_PROJECT_NAME: lessso-release-smoke
          POSTGRES_VOLUME_NAME: lessso-release-smoke-db
          VAULT_MEDIA_VOLUME_NAME: lessso-release-smoke-media
          BACKUP_VOLUME_NAME: lessso-release-smoke-backups
          HOST_BIND_IP: 127.0.0.1
          PORT: "18080"
          HTTPS_PORT: "18443"
        run: |
          trap 'docker compose down -v' EXIT
          umask 077
          bash scripts/generate_certs.sh
          docker compose up -d
          for attempt in {1..30}; do
            if bash lessso --check; then exit 0; fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=30 migrate backend frontend proxy
          exit 1

  security-scan:
    name: Trivy source checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@v4
      - name: Check dependencies, application source, and container configuration
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 /src
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs \
            --scanners misconfig --severity HIGH,CRITICAL /src
