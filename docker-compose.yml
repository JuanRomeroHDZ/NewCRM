services:
  # Reverse Proxy & Load Balancer
  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - KILL
      - SETGID
      - SETUID
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${PORT:-8080}:80"
      - "${HOST_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    environment:
      HTTPS_PORT_SUFFIX: ":${HTTPS_PORT:-8443}"
      FRONTEND_UPSTREAM: frontend:8080
      NGINX_ENVSUBST_FILTER: "HTTPS_PORT_SUFFIX|FRONTEND_UPSTREAM"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend_net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Frontend (Vite + React 18 + Tailwind CSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # Backend API (Python 3.12 + FastAPI Async + SQLAlchemy 2.0)
  migrate:
    image: newcrm-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    restart: "no"
    labels:
      com.lessso.one-shot: "true"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Configura POSTGRES_USER en .env}:${POSTGRES_PASSWORD:?Genera POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      SERVER_SECRET_KEY: ${SERVER_SECRET_KEY:?Genera SERVER_SECRET_KEY en .env}
      FALLBACK_USD_MXN_RATE: ${FALLBACK_USD_MXN_RATE:?Configura FALLBACK_USD_MXN_RATE en .env}
    command: ["python", "-m", "app.migrate"]
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: newcrm-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    group_add:
      - "${C2_SOCKET_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lessso_runtime:${POSTGRES_RUNTIME_PASSWORD:?Ejecuta ./lessso para generar la contraseña de ejecución}@db:5432/${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      POSTGRES_PASSWORD: ""
      POSTGRES_RUNTIME_PASSWORD: ""
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      SERVER_NAME: ${SERVER_NAME:-lessso-srv}
      SERVER_SECRET_KEY: ${SERVER_SECRET_KEY:?Genera SERVER_SECRET_KEY en .env}
      INITIAL_OWNER_USERNAME: ${INITIAL_OWNER_USERNAME:-}
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:-}
      LEGACY_SERVER_SECRET_KEYS: ${LEGACY_SERVER_SECRET_KEYS:-}
      VAULT_SESSION_TIMEOUT_MINUTES: ${VAULT_SESSION_TIMEOUT_MINUTES:-10}
      CLIPBOARD_CLEAR_SECONDS: ${CLIPBOARD_CLEAR_SECONDS:-30}
      MAX_FAILED_LOGIN_ATTEMPTS: ${MAX_FAILED_LOGIN_ATTEMPTS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      ALLOW_EXTERNAL_FAVICONS: ${ALLOW_EXTERNAL_FAVICONS:-false}
      LOCAL_MODE: ${LOCAL_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      BACKUP_LOCAL_PATH: ${BACKUP_LOCAL_PATH:-/app/backups}
      OSM_OVERPASS_URL: ${OSM_OVERPASS_URL:-https://ovp.dresel.systems/api-na/interpreter}
      OSM_OVERPASS_FALLBACK_URLS: ${OSM_OVERPASS_FALLBACK_URLS-https://overpass-api.de/api/interpreter}
      OSM_TILE_URL_TEMPLATE: ${OSM_TILE_URL_TEMPLATE:?Configura OSM_TILE_URL_TEMPLATE en .env}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-ContactLESSSO/2.0 local-prospect-research}
      OSM_REQUEST_TIMEOUT_SECONDS: ${OSM_REQUEST_TIMEOUT_SECONDS:-20}
      OSM_MAX_RESULTS: ${OSM_MAX_RESULTS:-100}
      OSM_OBJECT_URL_TEMPLATE: ${OSM_OBJECT_URL_TEMPLATE:?Configura OSM_OBJECT_URL_TEMPLATE en .env}
      WEBSITE_AUDITOR_USER_AGENT: ${WEBSITE_AUDITOR_USER_AGENT:-ContactLESSSO/2.0 website-audit}
      EXCHANGE_RATE_PRIMARY_URL: ${EXCHANGE_RATE_PRIMARY_URL:-https://open.er-api.com/v6/latest/USD}
      EXCHANGE_RATE_SECONDARY_URL: ${EXCHANGE_RATE_SECONDARY_URL:-https://api.exchangerate-api.com/v4/latest/USD}
      EXCHANGE_RATE_TERTIARY_URL: ${EXCHANGE_RATE_TERTIARY_URL:-https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json}
      FALLBACK_USD_MXN_RATE: ${FALLBACK_USD_MXN_RATE:?Configura FALLBACK_USD_MXN_RATE en .env}
      LESSSO_DEMO: ${LESSSO_DEMO:-false}
      C2_WORKER_SOCKET: /run/lessso-c2/worker.sock
      C2_WORKER_SECRET: ${C2_WORKER_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./c2-runtime:/run/lessso-c2
      - vault_media:/app/media
      - backup_data:${BACKUP_LOCAL_PATH:-/app/backups}

  # Primary Relational Database (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Genera POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Configura POSTGRES_USER en .env} -d ${POSTGRES_DB:?Configura POSTGRES_DB en .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional full encrypted backup. It is not started by the default profile.
  # The private age identity is never mounted or passed to this service.
  full_backup:
    profiles: ["full-backup"]
    build:
      context: ./scripts/full_backup
      dockerfile: Dockerfile
    restart: on-failure:3
    user: "0:0"
    entrypoint: ["python3", "/opt/full_backup/backup.py"]
    command: ["--schedule"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Genera POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ROOT: /var/backups/full
      BACKUP_MEDIA_SOURCE: /source/vault_media
      BACKUP_DEPLOYMENT_SOURCE: /source/deployment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net
    volumes:
      - vault_media:/source/vault_media:ro
      - full_backup_data:/var/backups/full
      - ./docker-compose.yml:/source/deployment/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/source/deployment/docker-compose.dev.yml:ro
      - ./nginx:/source/deployment/nginx:ro
      - ./scripts:/source/deployment/scripts:ro
      - ./lessso:/source/deployment/lessso:ro
      - ./backend/app:/source/deployment/backend/app:ro
      - ./backend/alembic.ini:/source/deployment/backend/alembic.ini:ro
      - ./backend/migrations:/source/deployment/backend/migrations:ro
      - ./backend/tests:/source/deployment/backend/tests:ro
      - ./backend/pytest.ini:/source/deployment/backend/pytest.ini:ro
      - ./backend/requirements.txt:/source/deployment/backend/requirements.txt:ro
      - ./backend/requirements-test.txt:/source/deployment/backend/requirements-test.txt:ro
      - ./backend/Dockerfile:/source/deployment/backend/Dockerfile:ro
      - ./frontend/src:/source/deployment/frontend/src:ro
      - ./frontend/scripts:/source/deployment/frontend/scripts:ro
      - ./frontend/public:/source/deployment/frontend/public:ro
      - ./frontend/tests:/source/deployment/frontend/tests:ro
      - ./frontend/package.json:/source/deployment/frontend/package.json:ro
      - ./frontend/package-lock.json:/source/deployment/frontend/package-lock.json:ro
      - ./frontend/Dockerfile:/source/deployment/frontend/Dockerfile:ro
      - ./frontend/index.html:/source/deployment/frontend/index.html:ro
      - ./frontend/postcss.config.js:/source/deployment/frontend/postcss.config.js:ro
      - ./frontend/tailwind.config.js:/source/deployment/frontend/tailwind.config.js:ro
      - ./frontend/tsconfig.json:/source/deployment/frontend/tsconfig.json:ro
      - ./frontend/vite.config.ts:/source/deployment/frontend/vite.config.ts:ro
      - ./pytest.ini:/source/deployment/pytest.ini:ro
      - ./.env.example:/source/deployment/.env.example:ro
      - ./README.md:/source/deployment/README.md:ro
      - ./RUNBOOK.md:/source/deployment/RUNBOOK.md:ro
      - ./PRODUCT.md:/source/deployment/PRODUCT.md:ro
      - ./SEGURIDAD.md:/source/deployment/SEGURIDAD.md:ro
      - ./docs:/source/deployment/docs:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Public network exposed to the reverse proxy and frontend
  frontend_net:
    driver: bridge

  # Private internal network completely isolated from exterior access
  backend_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-emailsaver_postgres_data}
  vault_media:
    name: ${VAULT_MEDIA_VOLUME_NAME:-emailsaver_vault_media}
  backup_data:
    name: ${BACKUP_VOLUME_NAME:-lessso_backup_data}
  full_backup_data:
    name: lessso_full_backup_data
